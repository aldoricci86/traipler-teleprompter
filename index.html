<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Traipler Prompt">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Traipler Teleprompter</title>
<style>
:root{--bg:#080b09;--panel:#111713;--panel2:#18221b;--line:#29372d;--green:#8ce0a0;--white:#f4f7f4;--muted:#91a096;--guide:30%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--white);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:650;min-height:44px}
.btn.primary{background:var(--green);border-color:var(--green);color:#09200f}
.btn.ghost{background:transparent}
.btn.danger{color:#ff9a9a}
.muted{color:var(--muted);font-size:12px}

/* ---------- editor ---------- */
#editor{min-height:100%;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 12px}
.brand{font-weight:850;display:flex;align-items:center;gap:10px;letter-spacing:.3px}
.mark{width:32px;height:32px;border-radius:10px;background:var(--green);color:#09200f;display:grid;place-items:center}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.5px}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;flex:1}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card h2{font-size:13px;margin:0;padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:.4px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
.tab{flex:none;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:8px 14px;font-size:13px}
.tab.on{background:var(--green);color:#09200f;border-color:var(--green);font-weight:700}
#script{display:block;width:100%;min-height:340px;height:48vh;resize:vertical;background:transparent;border:0;outline:0;padding:16px;font-size:17px;line-height:1.6}
.foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.settings{padding:14px 15px;display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.field label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}.field b{color:var(--white)}
.field input[type=range]{width:100%;accent-color:var(--green);height:28px}
select{width:100%;background:#0b100c;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px}
.pair{padding:13px 15px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.pair img{width:96px;height:96px;background:#fff;border-radius:8px;padding:4px;flex:none}
.pairinfo{font-size:12px;color:var(--muted);line-height:1.5}.pairinfo b{display:block;color:#fff;font-size:13px;margin-bottom:3px}
.bigplay{margin-top:12px;width:100%;font-size:18px;padding:16px;border-radius:16px}

/* ---------- teleprompter a tutto schermo (dentro l'app, senza API fullscreen) ---------- */
#prompt{position:fixed;inset:0;z-index:50;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#pview{position:absolute;inset:0}
#mir{position:absolute;inset:0;overflow:hidden}
#scroller{position:absolute;left:0;right:0;top:0;will-change:transform;color:#fff;font-weight:700;letter-spacing:.005em}
#txt{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
#guide{position:absolute;left:0;right:0;top:var(--guide);height:0;pointer-events:none;z-index:2}
#guide:before,#guide:after{content:"";position:absolute;top:-14px;border:14px solid transparent}
#guide:before{left:0;border-left-color:#ff4d4d;border-left-width:22px}
#guide:after{right:0;border-right-color:#ff4d4d;border-right-width:22px}
#guide i{position:absolute;left:30px;right:30px;top:-1px;height:2px;background:#ff4d4d55}
#cd{position:absolute;inset:0;display:grid;place-items:center;font-size:30vmin;font-weight:800;color:#fff;background:#000a;z-index:5;pointer-events:none}
.ui{position:absolute;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));background:linear-gradient(#000d,#0000);transition:opacity .25s}
#utop{top:0;padding-top:max(12px,env(safe-area-inset-top))}
#ubot{bottom:0;background:linear-gradient(#0000,#000e);padding-bottom:max(14px,env(safe-area-inset-bottom));flex-direction:column;gap:10px}
.ui.off{opacity:0;pointer-events:none}
.ui .btn{background:#1b241dcc;backdrop-filter:blur(6px);min-width:48px;min-height:48px}
.ui .btn.primary{background:var(--green)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
#seek{width:min(94%,900px);height:34px;accent-color:var(--green)}
.badge{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;min-width:84px;text-align:center}
.spacer{flex:1}

/* ---------- telecomando ---------- */
#remote{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 14px 24px}
#remote h1{font-size:22px;margin:6px 0 4px}
#remote .big{width:100%;padding:20px 8px;font-size:17px;border-radius:16px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.sl{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:18px 0 6px}.sl b{color:#fff}
#remote input[type=range]{width:100%;accent-color:var(--green);height:36px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#d4f7dc;color:#102516;padding:11px 15px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:99}.toast.show{opacity:1}
</style>
</head>
<body>

<div id="editor">
 <div class="top">
  <div class="brand"><div class="mark">T</div><div>TRAIPLER<small>TELEPROMPTER</small></div></div>
  <span class="muted" id="connection">● Avvio…</span>
 </div>
 <div class="cols">
  <section class="card">
   <h2>COPIONI <button class="btn" id="newScript">+ Nuovo</button></h2>
   <div class="tabs" id="tabs"></div>
   <textarea id="script" placeholder="Incolla qui il testo del tuo video…" autocapitalize="sentences"></textarea>
   <div class="foot"><span class="muted" id="stats">0 parole</span>
    <span style="display:flex;gap:8px"><button class="btn" id="import">+ File TXT</button><button class="btn danger" id="del">Elimina</button><input hidden type="file" id="file" accept=".txt,.md"></span></div>
  </section>
  <div>
   <section class="card">
    <h2>IMPOSTAZIONI</h2>
    <div class="settings">
     <div class="field"><label>Velocità <b id="wpmv"></b></label><input id="wpm" type="range" min="20" max="250" step="1"></div>
     <div class="field"><label>Dimensione testo <b id="fontv"></b></label><input id="font" type="range" min="28" max="160"></div>
     <div class="field"><label>Interlinea <b id="linev"></b></label><input id="line" type="range" min="1.1" max="2.2" step=".05"></div>
     <div class="field"><label>Margini <b id="marginv"></b></label><input id="margin" type="range" min="2" max="25"></div>
     <div class="field"><label>Specchiatura</label><select id="mirror"><option value="1">Sì (per vetro teleprompter)</option><option value="0">No</option></select></div>
     <div class="field"><label>Conto alla rovescia</label><select id="count"><option value="0">Nessuno</option><option value="3">3 secondi</option><option value="5">5 secondi</option><option value="10">10 secondi</option></select></div>
     <div class="field"><label>Allineamento</label><select id="align"><option value="center">Centrato</option><option value="left">Sinistra</option></select></div>
     <div class="field"><label>Colore testo</label><select id="color"><option value="#ffffff">Bianco</option><option value="#ffe14d">Giallo</option><option value="#8ce0a0">Verde</option></select></div>
    </div>
    <div class="pair"><img id="qr" alt="QR telecomando"><div class="pairinfo"><b>Telecomando iPhone</b>Inquadra il QR con l'iPhone. Serve Internet su entrambi solo per collegarli.<div id="pairurl" style="word-break:break-all;color:var(--green);margin-top:4px;font-size:11px"></div></div></div>
   </section>
   <button class="btn primary bigplay" id="open">▶ Apri teleprompter</button>
  </div>
 </div>
</div>

<div id="prompt" hidden>
 <div id="pview"><div id="mir"><div id="scroller"><div id="txt"></div></div></div></div>
 <div id="guide"><i></i></div>
 <div id="cd" hidden></div>
 <div class="ui" id="utop">
  <button class="btn" id="back">← Modifica</button>
  <span class="badge" id="time">00:00 / 00:00</span>
  <button class="btn" id="fm">A−</button><button class="btn" id="fp">A+</button>
  <button class="btn" id="mirrorBtn">⇋ Specchia</button>
 </div>
 <div class="ui" id="ubot">
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posizione">
  <div class="row">
   <button class="btn" id="toStart">Inizio</button>
   <button class="btn" id="rew">−10 s</button>
   <button class="btn primary" id="play" style="min-width:84px;font-size:22px">▶</button>
   <button class="btn" id="fwd">+10 s</button>
   <span class="spacer"></span>
   <button class="btn" id="sm">−</button><span class="badge" id="wpmBadge">150 WPM</span><button class="btn" id="sp">+</button>
  </div>
 </div>
</div>

<div id="remote" hidden>
 <h1>Telecomando Traipler</h1><div class="muted" id="rstatus">Connessione all'iPad…</div>
 <div class="twocol" style="margin-top:16px"><button class="btn primary big" id="rplay">▶ Play / Pausa</button><button class="btn big" id="ropen">Apri teleprompter</button></div>
 <div class="sl"><span>Posizione nel testo</span><b id="rposv">0%</b></div><input id="rpos" type="range" min="0" max="1000" value="0">
 <div class="twocol"><button class="btn big" id="rrew">−10 s</button><button class="btn big" id="rfwd">+10 s</button><button class="btn big" id="rstart">Dall'inizio</button><button class="btn big" id="rmirror">⇋ Specchia</button></div>
 <div class="sl"><span>Velocità</span><b id="rwpmv">150 WPM</b></div>
 <div class="twocol"><button class="btn big" id="rslow">− più lento</button><button class="btn big" id="rfast">+ più veloce</button></div>
 <div class="twocol"><button class="btn big" id="rfm">A− testo</button><button class="btn big" id="rfp">A+ testo</button></div>
</div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),remoteMode=new URLSearchParams(location.search).has('remote');
const GUIDE=.30; // il testo si legge sulla riga a 30% dall'alto
const DEF={wpm:110,font:64,line:1.5,margin:7,mirror:'1',count:'3',align:'center',color:'#ffffff'};
let S={...DEF},scripts=[],cur=0;
try{Object.assign(S,JSON.parse(localStorage.getItem('tp-settings')||'{}'))}catch{}
try{scripts=JSON.parse(localStorage.getItem('tp-scripts')||'[]')}catch{}
if(!scripts.length){let old='';try{old=localStorage.getItem('traipler-script')||''}catch{}scripts=[{id:Date.now(),text:old}]}
try{cur=Math.min(scripts.length-1,+localStorage.getItem('tp-cur')||0)}catch{}
const saveS=()=>{try{localStorage.setItem('tp-settings',JSON.stringify(S));localStorage.setItem('tp-scripts',JSON.stringify(scripts));localStorage.setItem('tp-cur',cur)}catch{}};
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

/* ---------- collegamento iPad <-> iPhone ---------- */
let peer=null,conn=null;
function send(m){if(conn&&conn.open)try{conn.send(m)}catch{}}
function setupPeer(){
 if(!window.Peer){if(remoteMode)$('rstatus').textContent='Servizio di collegamento non raggiungibile: serve Internet.';else $('connection').textContent='Senza Internet: telecomando non disponibile';return}
 if(!remoteMode){
  peer=new Peer(undefined,{debug:0});
  peer.on('open',id=>{$('connection').textContent='● QR pronto';const url=location.href.split('?')[0].split('#')[0]+'?remote='+encodeURIComponent(id);$('pairurl').textContent=url;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(url)});
  peer.on('connection',c=>{if(conn&&conn.open){c.close();return}conn=c;c.on('data',m=>{if(m&&m.type==='cmd')command(m)});c.on('open',()=>{$('connection').textContent='● iPhone collegato';broadcast()});c.on('close',()=>{conn=null;$('connection').textContent='● QR pronto'})});
  peer.on('error',e=>{$('connection').textContent='Connessione: '+e.type});
 }else{
  const id=new URLSearchParams(location.search).get('remote');if(!id){$('rstatus').textContent='Codice mancante';return}
  peer=new Peer(undefined,{debug:0});
  peer.on('open',()=>{conn=peer.connect(id,{reliable:true});conn.on('open',()=>{$('rstatus').textContent='● Collegato all\'iPad'});conn.on('data',m=>{if(m&&m.type==='state')remoteState(m)});conn.on('close',()=>{$('rstatus').textContent='Connessione interrotta: ricarica la pagina'})});
  peer.on('error',e=>{$('rstatus').textContent='Connessione non riuscita: '+e.type});
 }
}

/* ---------- telecomando iPhone ---------- */
if(remoteMode){
 $('editor').hidden=true;$('remote').hidden=false;
 const c=(action,value)=>()=>send({type:'cmd',action,value});
 $('rplay').onclick=c('toggle');$('ropen').onclick=c('open');$('rrew').onclick=c('seek',-10);$('rfwd').onclick=c('seek',10);$('rstart').onclick=c('start');
 $('rmirror').onclick=c('mirror');$('rslow').onclick=c('wpmd',-5);$('rfast').onclick=c('wpmd',5);$('rfm').onclick=c('fontd',-4);$('rfp').onclick=c('fontd',4);
 let dragging=false;$('rpos').oninput=()=>{dragging=true;$('rposv').textContent=Math.round($('rpos').value/10)+'%';send({type:'cmd',action:'pos',value:$('rpos').value/1000})};$('rpos').onchange=()=>{dragging=false};
 window.remoteState=m=>{$('rplay').textContent=m.running?'Ⅱ Pausa':'▶ Play';$('rwpmv').textContent=m.wpm+' WPM';if(!dragging){$('rpos').value=Math.round(m.pos*1000);$('rposv').textContent=Math.round(m.pos*100)+'%'}$('rstatus').textContent=(m.open?(m.running?'● In riproduzione':'● In pausa'):'● Collegato · teleprompter chiuso')+' · '+m.time};
 try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch{}
 setupPeer();return;
}

/* ---------- editor e copioni ---------- */
const script=$('script');
function words(){const t=script.value.trim();return t?t.split(/\s+/).length:0}
function title(s,i){const l=(s.text||'').trim().split('\n')[0].slice(0,28);return l||('Copione '+(i+1))}
function renderTabs(){$('tabs').innerHTML='';scripts.forEach((s,i)=>{const b=document.createElement('button');b.className='tab'+(i===cur?' on':'');b.textContent=title(s,i);b.onclick=()=>{cur=i;loadScript();saveS()};$('tabs').appendChild(b)})}
function loadScript(){script.value=scripts[cur].text;renderTabs();stats()}
function stats(){const w=words();$('stats').textContent=w+' parole · circa '+Math.max(1,Math.round(w/S.wpm))+' min a '+S.wpm+' WPM'}
script.oninput=()=>{scripts[cur].text=script.value;stats();saveS();clearTimeout(script._t);script._t=setTimeout(renderTabs,400)};
$('newScript').onclick=()=>{scripts.push({id:Date.now(),text:''});cur=scripts.length-1;loadScript();saveS();script.focus()};
$('del').onclick=()=>{if(!confirm('Eliminare questo copione?'))return;scripts.splice(cur,1);if(!scripts.length)scripts=[{id:Date.now(),text:''}];cur=Math.max(0,Math.min(cur,scripts.length-1));loadScript();saveS()};
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(f){scripts.push({id:Date.now(),text:await f.text()});cur=scripts.length-1;loadScript();saveS();toast('Copione importato')}};
function syncSettings(){
 $('wpm').value=S.wpm;$('font').value=S.font;$('line').value=S.line;$('margin').value=S.margin;$('mirror').value=S.mirror;$('count').value=S.count;$('align').value=S.align;$('color').value=S.color;
 $('wpmv').textContent=S.wpm+' WPM';$('fontv').textContent=S.font+' px';$('linev').textContent=S.line;$('marginv').textContent=S.margin+'%';$('wpmBadge').textContent=S.wpm+' WPM';
}
['wpm','font','line','margin'].forEach(k=>$(k).oninput=()=>{S[k]=+$(k).value;syncSettings();applyStyle();stats();saveS()});
['mirror','count','align','color'].forEach(k=>$(k).onchange=()=>{S[k]=$(k).value;syncSettings();applyStyle();saveS()});

/* ---------- teleprompter ---------- */
let open=false,running=false,offset=0,raf=0,lastT=0,cdTimer=null,hideT=null,wake=null,vel=0;
const pview=$('pview'),scroller=$('scroller'),txt=$('txt');
function applyStyle(){
 const h=pview.clientHeight||innerHeight;
 txt.style.fontSize=S.font+'px';txt.style.lineHeight=S.line;txt.style.textAlign=S.align;txt.style.color=S.color;
 scroller.style.padding=`${Math.round(h*GUIDE)}px ${S.margin}% ${Math.round(h*(1-GUIDE))}px`;
 $('mir').style.transform=(open&&S.mirror==='1')?'scaleX(-1)':'';
 draw();
}
function textH(){return txt.offsetHeight}
function maxOff(){return Math.max(1,textH())}
// px al secondo: dalla velocita' in parole al minuto e dalla densita' vera del testo
function pxs(){const w=Math.max(1,words());return (S.wpm/60)*(textH()/w)}
function draw(){
 offset=Math.max(0,Math.min(maxOff(),offset));
 scroller.style.transform=`translateY(${-offset}px)`;
 const dur=words()/S.wpm*60,pos=offset/maxOff();
 $('time').textContent=fmt(pos*dur)+' / '+fmt(dur);
 if(!seeking)$('seek').value=Math.round(pos*1000);
 $('wpmBadge').textContent=S.wpm+' WPM';
}
let seeking=false;
function tick(t){
 if(!running)return;
 if(!lastT)lastT=t;const dt=Math.min(.1,(t-lastT)/1000);lastT=t;
 offset+=pxs()*dt;
 if(offset>=maxOff()){offset=maxOff();pausePlay();draw();broadcast();return}
 draw();raf=requestAnimationFrame(tick);
}
function startPlay(){if(!words())return toast('Scrivi prima il copione');running=true;lastT=0;$('play').textContent='Ⅱ';cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);showUI(true);broadcast()}
function pausePlay(){running=false;cancelAnimationFrame(raf);$('play').textContent='▶';showUI(true);broadcast()}
function clearCd(){if(cdTimer){clearInterval(cdTimer);cdTimer=null}$('cd').hidden=true}
function togglePlay(){
 if(cdTimer){clearCd();$('play').textContent='▶';return}
 if(running){pausePlay();return}
 if(offset>=maxOff()-1)offset=0;
 let n=offset<5?+S.count:0;
 if(n){$('cd').hidden=false;$('cd').textContent=n;$('play').textContent='Ⅱ';cdTimer=setInterval(()=>{n--;if(n<=0){clearCd();startPlay()}else $('cd').textContent=n},1000)}
 else startPlay();
}
function seekSec(s){offset+=pxs()*s;draw();broadcast()}
function toStart(){clearCd();offset=0;draw();broadcast()}
function showUI(stay){
 ['utop','ubot'].forEach(i=>$(i).classList.remove('off'));clearTimeout(hideT);
 if(running&&!stay)hideT=setTimeout(()=>{if(running&&!seeking)['utop','ubot'].forEach(i=>$(i).classList.add('off'))},3500);
}
async function lock(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch{}}
function openPrompt(){
 open=true;$('prompt').hidden=false;txt.textContent=script.value.trim();
 try{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen||(()=>{})).call(e)}catch{}
 lock();requestAnimationFrame(()=>{applyStyle();showUI(true);broadcast()})
}
function closePrompt(){
 clearCd();pausePlay();open=false;$('prompt').hidden=true;applyStyle();
 try{if(document.fullscreenElement)document.exitFullscreen()}catch{}
 try{wake&&wake.release()}catch{};broadcast()
}
document.addEventListener('visibilitychange',()=>{if(open&&document.visibilityState==='visible')lock()});

/* trascinare il testo con il dito (anche mentre scorre), con inerzia; un tocco = play/pausa */
let drag=null;
pview.addEventListener('pointerdown',e=>{
 pview.setPointerCapture(e.pointerId);
 drag={y:e.clientY,off:offset,t:performance.now(),moved:false,was:running,ly:e.clientY,lt:performance.now()};
 vel=0;if(running){running=false;cancelAnimationFrame(raf)}
});
pview.addEventListener('pointermove',e=>{
 if(!drag)return;const dy=e.clientY-drag.y;
 if(Math.abs(dy)>8)drag.moved=true;
 if(drag.moved){offset=drag.off-dy;const now=performance.now(),dt=now-drag.lt;if(dt>0){vel=(drag.ly-e.clientY)/dt;drag.ly=e.clientY;drag.lt=now}draw();showUI(true)}
});
function endDrag(){
 if(!drag)return;const d=drag;drag=null;
 if(!d.moved){ // tocco
  if(d.was){running=true;pausePlay()}else togglePlay();return}
 const fling=()=>{if(drag||Math.abs(vel)<.02){if(d.was&&!drag){startPlay()}else broadcast();return}offset+=vel*16;vel*=.94;draw();requestAnimationFrame(fling)};
 fling();
}
pview.addEventListener('pointerup',endDrag);pview.addEventListener('pointercancel',endDrag);
pview.addEventListener('wheel',e=>{e.preventDefault();offset+=e.deltaY;draw();showUI()},{passive:false});
$('seek').addEventListener('input',()=>{seeking=true;offset=$('seek').value/1000*maxOff();draw();showUI(true)});
$('seek').addEventListener('change',()=>{seeking=false;broadcast();showUI()});
$('play').onclick=e=>{e.stopPropagation();togglePlay()};
$('toStart').onclick=toStart;$('rew').onclick=()=>seekSec(-10);$('fwd').onclick=()=>seekSec(10);
$('back').onclick=closePrompt;
const setWpm=v=>{S.wpm=Math.max(20,Math.min(250,v));syncSettings();stats();saveS();draw();broadcast()};
$('sm').onclick=()=>setWpm(S.wpm-5);$('sp').onclick=()=>setWpm(S.wpm+5);
const setFont=v=>{const keep=offset/maxOff();S.font=Math.max(28,Math.min(160,v));syncSettings();applyStyle();offset=keep*maxOff();draw();saveS()};
$('fm').onclick=()=>setFont(S.font-4);$('fp').onclick=()=>setFont(S.font+4);
const toggleMirror=()=>{S.mirror=S.mirror==='1'?'0':'1';syncSettings();applyStyle();saveS();broadcast()};
$('mirrorBtn').onclick=toggleMirror;
$('open').onclick=openPrompt;
document.addEventListener('keydown',e=>{if(!open)return;if(e.code==='Space'){e.preventDefault();togglePlay()}else if(e.code==='ArrowDown')seekSec(5);else if(e.code==='ArrowUp')seekSec(-5);else if(e.code==='Escape')closePrompt()});
['utop','ubot'].forEach(i=>{$(i).addEventListener('pointerdown',e=>{e.stopPropagation();showUI(true)});$(i).addEventListener('pointerup',()=>showUI())});
window.addEventListener('resize',()=>{if(open){const k=offset/maxOff();applyStyle();offset=k*maxOff();draw()}});

/* comandi dal telecomando */
function command(m){
 const a=m.action,v=m.value;
 if(a==='open'){if(!open)openPrompt()}
 else if(a==='toggle'){if(!open)openPrompt();setTimeout(togglePlay,open?0:300)}
 else if(a==='seek'){seekSec(v)}
 else if(a==='start'){toStart()}
 else if(a==='mirror'){toggleMirror()}
 else if(a==='wpmd'){setWpm(S.wpm+v)}
 else if(a==='fontd'){setFont(S.font+v)}
 else if(a==='pos'){offset=v*maxOff();draw();broadcast()}
}
let bt=0;function broadcast(){const now=Date.now();if(now-bt<120&&running)return;bt=now;send({type:'state',running,open,wpm:S.wpm,pos:open?offset/maxOff():0,time:$('time').textContent})}
setInterval(()=>{if(conn)broadcast()},1000);

syncSettings();loadScript();setupPeer();
})();
</script>
</body>
